# Optional: enable after pushing this repo to GitHub and adding secrets:
#   ZAHID_SSH_KEY  — private key matching ~/.ssh/keys/zee-personal.pem
#   ZAHID_SSH_HOST — e.g. ubuntu@54.203.135.144
name: Deploy to zahid.cc

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ZAHID_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 54.203.135.144 >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.ZAHID_SSH_HOST }}
        run: |
          rsync -avz \
            --exclude-from=.rsync-excludes \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ \
            "${SSH_HOST}:/var/www/html/"
